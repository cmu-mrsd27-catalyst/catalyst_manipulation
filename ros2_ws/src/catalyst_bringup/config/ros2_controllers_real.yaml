# ros2_control Controller Configuration for Catalyst Manipulator (Real Hardware)
#
# Arm-only configuration — the bio gripper is controlled independently
# via the Dynamixel SDK (see catalyst_gripper package).

controller_manager:
  ros__parameters:
    # 100 Hz instead of 150 Hz: the xArm hardware interface does a synchronous
    # network read/write each cycle (~5-6 ms). Jazzy's controller_manager has
    # higher per-cycle overhead than Humble, so at 150 Hz (6.67 ms budget) the
    # loop occasionally overruns. 100 Hz (10 ms budget) gives comfortable margin.
    update_rate: 100  # Hz

    # List of controllers to load
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    xarm6_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController


# Joint State Broadcaster - Publishes arm joint states to /joint_states
# Note: right_finger_joint is published by the catalyst_gripper node instead
joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6


# xArm-6 Trajectory Controller - Executes arm trajectories
# Aligned with upstream xarm_ros2 xarm6_controllers.yaml
xarm6_traj_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    command_interfaces:
      - position
      - velocity

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 25.0
    action_monitor_rate: 10.0

    allow_partial_joints_goal: false
    open_loop_control: true

    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.0
      joint1: {trajectory: 1.0, goal: 0.01}
      joint2: {trajectory: 1.0, goal: 0.01}
      joint3: {trajectory: 1.0, goal: 0.01}
      joint4: {trajectory: 1.0, goal: 0.01}
      joint5: {trajectory: 1.0, goal: 0.01}
      joint6: {trajectory: 1.0, goal: 0.01}
