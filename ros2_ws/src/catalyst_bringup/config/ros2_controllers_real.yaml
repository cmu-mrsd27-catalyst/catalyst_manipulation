# ros2_control Controller Configuration for Catalyst Manipulator (Real Hardware)
#
# Arm-only configuration — the bio gripper is controlled independently
# via the Dynamixel SDK (see catalyst_gripper package).

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # List of controllers to load
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    xarm6_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController


# Joint State Broadcaster - Publishes arm joint states to /joint_states
# Note: right_finger_joint is published by the catalyst_gripper node instead
joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6


# xArm-6 Trajectory Controller - Executes arm trajectories
xarm6_traj_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 100.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: false

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
