# ros2_control Controller Configuration for Catalyst Manipulator
#
# This file defines the controllers that ros2_control will load and manage.
# Used with both fake hardware (simulation) and real hardware.

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # List of controllers to load
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    xarm6_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    bio_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


# Joint State Broadcaster - Publishes joint states to /joint_states
joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - right_finger_joint
      # Note: left_finger_joint is a mimic joint - robot_state_publisher handles it


# xArm-6 Trajectory Controller - Executes arm trajectories
xarm6_traj_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 100.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: true

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0


# Bio Gripper Controller - Executes gripper trajectories
bio_gripper_controller:
  ros__parameters:
    joints:
      - right_finger_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 100.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: true

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
