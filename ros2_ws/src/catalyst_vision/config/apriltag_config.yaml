/**:
  ros__parameters:
    # --- Basic Settings ---
    image_transport: raw     # Standard for RealSense
    family: 36h11            # Recommended for accuracy/speed
    size: 0.04               # Default tag size (3cm)
    max_hamming: 0           # 0 is strictest (prevents false positives)

    # --- Detector Settings (Optimized for 3cm Tags) ---
    detector:
      threads: 4             # Increase to 2-4 if CPU allows
      decimate: 1.0          # 1.0 = Highest precision (best for small tags)
      blur: 0.0              # Keep at 0 unless image is very noisy
      refine: True           # Essential for sub-pixel accuracy
      sharpening: 0.25
      debug: False

    # --- Localization Method ---
    pose_estimation_method: "pnp"

    # --- Tag Definitions ---
    # Size here overrides the global 'size' above if different
    # tag:
    #   ids: [2]
    #   frames: [tag_object]
    #   sizes: [0.0584]

    tag:
      ids: [3]
      frames: [tag_object]
      sizes: [0.04]
